<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Malcolm Xavier — MX7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#f2ede4;color:#0e0c08;font-family:'JetBrains Mono',monospace;overflow-x:hidden}
::-webkit-scrollbar{width:3px;background:#f2ede4}
::-webkit-scrollbar-thumb{background:#c8bfb0}
img{display:block;max-width:100%}

@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes revealUp{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}
@keyframes mobileIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

.reveal{opacity:0;transform:translateY(48px);transition:opacity 0.8s cubic-bezier(0.22,1,0.36,1),transform 0.8s cubic-bezier(0.22,1,0.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ─── NAV ─── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 36px;height:56px;
  background:rgba(242,237,228,0.88);
  backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid rgba(14,12,8,0.1);
  transition:all 0.3s;
}
.nav.scrolled{background:rgba(242,237,228,0.97);border-bottom-color:rgba(14,12,8,0.18)}
.nav-logo{display:flex;align-items:baseline;gap:0;cursor:pointer;user-select:none}
.nav-links{display:flex;gap:24px}
.nav-link{font-size:9px;letter-spacing:3px;color:#6b6560;cursor:pointer;text-decoration:none;padding:3px 0;border-bottom:1px solid transparent;transition:all 0.2s}
.nav-link:hover{color:#0e0c08;border-bottom-color:rgba(14,12,8,0.4)}
.nav-right{display:flex;align-items:center;gap:16px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#3a8c5a;animation:blink 2.4s ease infinite}
.cta-nav{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;padding:8px 18px;background:#0e0c08;color:#f2ede4;border:none;cursor:pointer;transition:all 0.2s}
.cta-nav:hover{background:#c8a44a;color:#0e0c08}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:transparent;border:none}
.ham-line{width:22px;height:1.5px;background:#0e0c08;transition:all 0.3s;display:block}
.hamburger.open .ham-line:nth-child(1){transform:rotate(45deg) translate(4px,5px)}
.hamburger.open .ham-line:nth-child(2){opacity:0}
.hamburger.open .ham-line:nth-child(3){transform:rotate(-45deg) translate(4px,-5px)}
.mobile-nav{position:fixed;top:56px;inset:0;z-index:999;background:#f2ede4;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;animation:mobileIn 0.3s ease}
.mnav-link{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,72px);letter-spacing:6px;color:#c8bfb0;cursor:pointer;transition:color 0.2s;padding:4px 0}
.mnav-link:hover{color:#0e0c08}

/* ─── TICKER ─── */
.ticker-wrap{background:#0e0c08;overflow:hidden;height:36px;display:flex;align-items:center;border-bottom:none}
.ticker-track{display:flex;gap:0;animation:ticker 28s linear infinite;white-space:nowrap}
.ticker-item{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:4px;color:#f2ede4;padding:0 28px;border-right:1px solid #2a2820;display:flex;align-items:center;gap:12px}
.ticker-dot{width:4px;height:4px;border-radius:50%;background:#c8a44a;flex-shrink:0}

/* ─── HERO ─── */
.hero{position:relative;background:#f2ede4;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;padding-top:56px}
.hero-top-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 36px;border-bottom:1px solid rgba(14,12,8,0.1);position:relative;z-index:3;flex-shrink:0}
.hero-top-meta{font-size:8px;letter-spacing:3px;color:#6b6560}
.hero-top-issue{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:5px;color:#0e0c08}
/* 2-col hero: photo | content */
.hero-main{flex:1;display:grid;grid-template-columns:420px 1fr;position:relative;z-index:2;min-height:500px}
/* Photo column */
.hero-photo-col{
  position:relative;overflow:hidden;
  border-right:1px solid rgba(14,12,8,0.1);
  background:linear-gradient(180deg,#ede8de 0%,#e0d9ce 100%);
  display:flex;align-items:flex-end;justify-content:center;
}
.hero-photo-wrap{
  width:100%;position:relative;z-index:2;
  animation:float 7s ease-in-out infinite;
}
.hero-photo-wrap img{
  width:100%;max-height:540px;object-fit:cover;object-position:top center;
  display:block;
}
.hero-photo-ring{
  position:absolute;inset:16px 16px 0 16px;
  border:1px solid rgba(200,164,74,0.3);border-bottom:none;
  pointer-events:none;z-index:3;
}
.hero-photo-corner{position:absolute;z-index:4;width:16px;height:16px;border-color:rgba(200,164,74,0.6);border-style:solid}
.hero-photo-col-label{
  position:absolute;bottom:16px;left:16px;
  font-size:8px;letter-spacing:3px;color:rgba(14,12,8,0.3);z-index:4;
}
/* Content column */
.hero-content-col{
  padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.hero-giant{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(80px,11vw,160px);
  line-height:0.85;letter-spacing:0.02em;color:#0e0c08;
}
.hero-sub-row{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}
.hero-role-pill{display:inline-block;padding:5px 13px;border:1px solid rgba(14,12,8,0.18);font-size:8px;letter-spacing:2px;color:#6b6560;transition:all 0.2s;cursor:default}
.hero-role-pill:hover{background:#0e0c08;color:#f2ede4;border-color:#0e0c08}
.hero-divider-line{width:60px;height:2px;background:#0e0c08;margin:20px 0}
.hero-side-text{font-size:9px;letter-spacing:1px;color:#6b6560;line-height:2.2}
.hero-side-text strong{color:#0e0c08;display:block;letter-spacing:2px}
.hero-cta-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.hero-btn-blk{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;padding:12px 26px;background:#0e0c08;color:#f2ede4;border:none;cursor:pointer;transition:all 0.2s}
.hero-btn-blk:hover{background:#c8a44a;color:#0e0c08}
.hero-btn-out{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;padding:12px 26px;background:transparent;color:#0e0c08;border:1px solid rgba(14,12,8,0.3);cursor:pointer;transition:all 0.2s}
.hero-btn-out:hover{border-color:#0e0c08;background:#0e0c08;color:#f2ede4}
.hero-accent-bar{position:absolute;left:0;top:0;width:6px;height:100%;background:#c8a44a;z-index:5}
/* Stats */
.hero-bottom-bar{
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;
  border-top:2px solid #0e0c08;position:relative;z-index:4;
  background:#f2ede4;flex-shrink:0;
}
.hero-stat-cell{padding:18px 28px;border-right:1px solid rgba(14,12,8,0.15);cursor:default;transition:background 0.2s}
.hero-stat-cell:last-child{border-right:none}
.hero-stat-cell:hover{background:rgba(200,164,74,0.08)}
.hero-stat-n{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;color:#c8a44a}
.hero-stat-l{font-size:8px;letter-spacing:3px;color:#6b6560;margin-top:3px}

/* ─── SECTION STYLES ─── */
.mag-section{padding:80px 36px;position:relative}
.mag-section.dark{background:#0e0c08;color:#f2ede4}
.mag-section.gold-bg{background:#c8a44a;color:#0e0c08}
.mag-section.purple-bg{background:#7c4dba;color:#f2ede4}
.mag-section.red-bg{background:#d94f38;color:#f2ede4}
.mag-section.green-bg{background:#3a8c5a;color:#f2ede4}
.mag-section.cream{background:#f2ede4;color:#0e0c08}

.section-rule{height:2px;background:#0e0c08;margin-bottom:12px}
.section-rule.light{background:rgba(242,237,228,0.3)}
.section-rule.gold{background:#c8a44a}

.overline{font-size:8px;letter-spacing:5px;color:#6b6560;margin-bottom:8px}
.overline.light{color:rgba(242,237,228,0.5)}
.overline.gold-c{color:#c8a44a}

.display-xl{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,8vw,120px);line-height:0.9;letter-spacing:0.03em}
.display-lg{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,5.5vw,80px);line-height:0.92;letter-spacing:0.03em}
.display-md{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,3.5vw,52px);line-height:1;letter-spacing:0.04em}
.body-sm{font-size:11px;line-height:2;color:#6b6560}
.body-sm.light{color:rgba(242,237,228,0.6)}

/* ─── THE 7 ─── */
.the7-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-top:48px}
.the7-card{
  padding:28px 20px;border-right:1px solid rgba(14,12,8,0.12);
  cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;
  background:#f2ede4;min-height:320px;display:flex;flex-direction:column;
}
.the7-card:last-child{border-right:none}
.the7-card:hover{background:#0e0c08;color:#f2ede4}
.the7-card:hover .the7-card-num{color:rgba(242,237,228,0.2)}
.the7-card:hover .the7-card-key{color:#f2ede4}
.the7-card:hover .the7-card-icon{color:rgba(242,237,228,0.4)}
.the7-card:hover .the7-card-blurb{color:rgba(242,237,228,0.6)}
.the7-card:hover .the7-card-bar{opacity:1}
.the7-card-bar{position:absolute;top:0;left:0;right:0;height:3px;opacity:0.4;transition:opacity 0.25s}
.the7-card-num{font-size:9px;letter-spacing:3px;color:#c8bfb0;margin-bottom:auto;transition:color 0.25s}
.the7-card-icon{font-size:24px;margin:28px 0 12px;transition:color 0.25s}
.the7-card-key{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;margin-bottom:8px;transition:color 0.25s}
.the7-card-blurb{font-size:9px;letter-spacing:0.5px;line-height:1.9;color:#6b6560;transition:color 0.25s}

/* Active tab panel */
.the7-panel-area{border-top:2px solid #0e0c08;display:grid;grid-template-columns:1fr 2fr;min-height:300px}
.the7-panel-left{padding:40px 36px;border-right:1px solid rgba(14,12,8,0.12);background:#f2ede4}
.the7-panel-right{padding:40px 48px;background:#0e0c08;color:#f2ede4;position:relative;overflow:hidden;animation:fadeUp 0.3s ease}
.the7-panel-ghost{
  position:absolute;right:-20px;top:-20px;
  font-family:'Bebas Neue',sans-serif;font-size:200px;
  opacity:0.04;line-height:1;pointer-events:none;user-select:none;
}

/* ─── PROJECTS ─── */
.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:40px}
.proj-card{
  background:#fff8f0;padding:32px 28px;
  cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;
  border:1px solid rgba(14,12,8,0.08);
}
.proj-card::after{content:'';position:absolute;left:0;bottom:0;right:0;height:3px;transform:scaleX(0);transition:transform 0.3s;transform-origin:left}
.proj-card:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(14,12,8,0.12)}
.proj-card:hover::after{transform:scaleX(1)}
.proj-card-shimmer{position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(200,164,74,0.08),transparent);transition:left 0.5s ease;pointer-events:none}
.proj-card:hover .proj-card-shimmer{left:160%}
.proj-zone{font-size:8px;letter-spacing:3px;padding:3px 10px;border:1px solid;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;transition:all 0.2s}
.proj-card:hover .proj-zone{padding-left:14px}
.proj-year{font-size:9px;color:#6b6560;letter-spacing:1px}
.proj-title{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;margin-bottom:8px}
.proj-type{font-size:8px;letter-spacing:3px;color:#6b6560;margin-bottom:14px}
.proj-desc{font-size:10px;color:#6b6560;line-height:1.9}
.proj-arrow{font-size:9px;letter-spacing:2px;margin-top:22px;display:flex;align-items:center;gap:8px;transition:gap 0.2s}
.proj-card:hover .proj-arrow{gap:14px}
.proj-filters{display:flex;gap:6px;flex-wrap:wrap}
.pfil{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;padding:7px 14px;background:transparent;border:1px solid rgba(14,12,8,0.2);color:#6b6560;cursor:pointer;transition:all 0.15s}
.pfil:hover{border-color:#0e0c08;color:#0e0c08}
.pfil.active{background:#0e0c08;color:#f2ede4;border-color:#0e0c08}

/* ─── LOVE YOURS CLUB ─── */
.lyc-hero{
  display:grid;grid-template-columns:1fr 1fr;min-height:560px;
}
.lyc-left{
  background:#d94f38;padding:64px 52px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.lyc-right{
  background:#0e0c08;display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:2px;padding:2px;
}
.lyc-word{
  background:#18140c;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;
  color:rgba(217,79,56,0.25);cursor:pointer;transition:all 0.2s;
}
.lyc-word:hover{background:#d94f38;color:#f2ede4;font-size:14px}
.lyc-ghost{
  position:absolute;font-family:'Bebas Neue',sans-serif;
  font-size:clamp(120px,18vw,200px);color:rgba(242,237,228,0.06);
  line-height:1;right:-20px;bottom:-20px;pointer-events:none;user-select:none;
}
.lyc-badge{font-size:8px;letter-spacing:4px;padding:5px 14px;border:1px solid rgba(242,237,228,0.4);color:rgba(242,237,228,0.7);display:inline-block;margin-bottom:20px}
.lyc-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,8vw,110px);line-height:0.88;color:#f2ede4;margin-bottom:24px}
.lyc-desc{font-size:11px;color:rgba(242,237,228,0.65);line-height:2;margin-bottom:32px;max-width:380px}
.lyc-cta{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;padding:12px 28px;background:#f2ede4;color:#d94f38;border:none;cursor:pointer;transition:all 0.2s;align-self:flex-start}
.lyc-cta:hover{background:#0e0c08;color:#f2ede4}

/* ─── BLOG ─── */
.blog-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:40px}
.blog-card{
  background:#fff8f0;padding:36px 32px;border:1px solid rgba(14,12,8,0.08);
  cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;
}
.blog-card:hover{border-color:rgba(14,12,8,0.3);transform:translateY(-3px);box-shadow:0 12px 40px rgba(14,12,8,0.08)}
.blog-card-full{grid-column:1/-1;display:grid;grid-template-columns:80px 1fr auto;gap:28px;align-items:start}
.blog-num-big{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1;opacity:0.12;color:#0e0c08}
.blog-tag-pill{font-size:8px;letter-spacing:3px;padding:3px 10px;border:1px solid;display:inline-block;margin-bottom:10px}
.blog-date{font-size:9px;color:#6b6560;letter-spacing:1px}
.blog-title-lg{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1.05;margin-bottom:10px}
.blog-excerpt{font-size:10px;color:#6b6560;line-height:1.9}
.blog-read{font-size:9px;letter-spacing:2px;color:#6b6560;white-space:nowrap;padding-top:32px;transition:all 0.2s}
.blog-card:hover .blog-read{color:#0e0c08}

/* ─── PHILOSOPHY ─── */
.philosophy-bg{background:#0e0c08;color:#f2ede4;padding:100px 36px;text-align:center;position:relative;overflow:hidden}
.phil-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,18vw,200px);color:rgba(200,164,74,0.04);white-space:nowrap;pointer-events:none;letter-spacing:16px;user-select:none}
.morph-box{display:inline-block;padding:24px 56px;border:1px solid rgba(200,164,74,0.4);background:rgba(200,164,74,0.06);margin-top:44px}

/* ─── CONNECT ─── */
.connect-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:40px}
.connect-card{background:#fff8f0;padding:28px 32px;border:1px solid rgba(14,12,8,0.08);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all 0.2s}
.connect-card:hover{background:#0e0c08;color:#f2ede4;border-color:#0e0c08}
.connect-card:hover .con-sub{color:rgba(242,237,228,0.5)}
.connect-card:hover .con-arrow{color:#f2ede4}
.con-label{font-size:11px;letter-spacing:2px;margin-bottom:4px;font-weight:500}
.con-sub{font-size:9px;color:#6b6560;letter-spacing:1px;transition:color 0.2s}
.con-arrow{font-size:20px;color:#6b6560;transition:color 0.2s}

/* ─── FOOTER ─── */
footer{background:#0e0c08;color:#f2ede4;padding:28px 36px;display:flex;justify-content:space-between;align-items:center}
.footer-sig{display:flex;align-items:baseline;gap:2px}

/* ─── TWEAKS ─── */
.tweaks-panel{position:fixed;bottom:24px;right:24px;z-index:9999;background:rgba(242,237,228,0.97);border:1px solid rgba(14,12,8,0.2);backdrop-filter:blur(20px);padding:20px 22px;min-width:230px;display:none;box-shadow:0 8px 32px rgba(14,12,8,0.15)}
.tweaks-panel.open{display:block}
.tw-title{font-size:9px;letter-spacing:3px;color:#0e0c08;margin-bottom:16px;font-weight:700}
.tw-row{margin-bottom:12px}
.tw-label{font-size:8px;letter-spacing:2px;color:#6b6560;margin-bottom:7px}
.tw-opts{display:flex;gap:6px;flex-wrap:wrap}
.tw-opt{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1px;padding:5px 10px;border:1px solid rgba(14,12,8,0.2);color:#6b6560;background:transparent;cursor:pointer;transition:all 0.15s}
.tw-opt:hover,.tw-opt.active{border-color:#0e0c08;color:#0e0c08;background:rgba(14,12,8,0.06)}

/* ─── RESPONSIVE ─── */
@media(max-width:960px){
  .nav-links{display:none}
  .hamburger{display:flex}
  .hero-main{grid-template-columns:1fr}
  .hero-photo-col{min-height:380px;max-height:440px}
  .hero-content-col{padding:32px 24px}
  .hero-bottom-bar{grid-template-columns:1fr 1fr}
  .the7-grid{grid-template-columns:repeat(4,1fr)}
  .the7-panel-area{grid-template-columns:1fr}
  .projects-grid{grid-template-columns:1fr 1fr}
  .lyc-hero{grid-template-columns:1fr}
  .lyc-right{display:none}
  .blog-grid{grid-template-columns:1fr}
  .blog-card-full{grid-template-columns:1fr}
  .connect-grid{grid-template-columns:1fr}
  .mag-section{padding:60px 20px}
  .nav{padding:0 20px}
}
@media(max-width:600px){
  .the7-grid{grid-template-columns:repeat(2,1fr)}
  .projects-grid{grid-template-columns:1fr}
  .hero-bottom-bar{grid-template-columns:1fr 1fr}
  .hero-stat-n{font-size:28px}
}
</style>

/* Scroll reveal */
function useReveal(){
  const ref = useRef(null);
  const [vis,setVis] = useState(false);
  useEffect(()=>{
    if(!ref.current)return;
    const obs = new IntersectionObserver(([e])=>{if(e.isIntersecting){setVis(true);obs.disconnect();}},{threshold:0.08,rootMargin:"0px 0px -50px 0px"});
    obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return [ref,vis];
}
function Rev({children,delay=0,style={},className=""}){
  const [ref,vis]=useReveal();
  return <div ref={ref} className={`reveal${vis?" visible":""} ${className}`} style={{transitionDelay:`${delay}s`,...style}}>{children}</div>;
}

          <p style={{fontSize:13,color:"rgba(242,237,228,0.55)",lineHeight:2.2,marginBottom:8}}>
            Everyone's prompting AI. Getting average outputs<br/>from average inputs.
          </p>
          <p style={{fontSize:13,color:"rgba(242,237,228,0.85)",lineHeight:2.2,marginBottom:44}}>
            I'm architecting. Building systems that think in my voice, make decisions in my aesthetic, and get sharper with every project. The AI doesn't replace the creator — it amplifies whoever's running the machine.
          </p>
          <div className="morph-box" style={{borderColor:`${accent}55`,background:`linear-gradient(135deg,${accent}10,transparent)`}}>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:36,color:accent,letterSpacing:8}}>I DO NOT PROMPT.</div>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:36,color:"#f2ede4",letterSpacing:8}}>I ARCHITECT.</div>
          </div>
        </Rev>
      </section>

      {/* ─── CONNECT ─── */}
      <section className="mag-section" style={{background:"#ede8de"}} id="connect" data-screen-label="07 Connect">
        <Rev>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:8}}>
            <div>
              <div className="section-rule" style={{width:60,marginBottom:12,background:C.black}}/>
              <p className="overline">// CONNECT</p>
              <h2 className="display-xl" style={{marginTop:4}}>FIND <span style={{color:accent}}>ME</span></h2>
            </div>
            <p style={{fontSize:10,color:C.muted,textAlign:"right",lineHeight:2,maxWidth:280}}>
              Building in Pittsburgh.<br/>Working everywhere.<br/>Open to remote AI roles.
            </p>
          </div>
        </Rev>
        <Rev delay={0.15}>
          <div className="connect-grid">
            {[
              {label:"MALCOLMXAVIER.COM",sub:"Portfolio Hub",color:accent},
              {label:"LOVEYOURSCLUB.COM",sub:"Community Art Brand",color:C.red},
              {label:"LINKEDIN",sub:"Professional + Build Logs",color:C.purple},
              {label:"INSTAGRAM",sub:"Art. Drops. Life.",color:C.orange},
            ].map(l=>(
              <div key={l.label} className="connect-card">
                <div>
                  <div className="con-label" style={{color:l.color}}>{l.label}</div>
                  <div className="con-sub">{l.sub}</div>
                </div>
                <div className="con-arrow" style={{color:l.color}}>↗</div>
              </div>
            ))}
          </div>
          <div style={{marginTop:24,padding:"22px 28px",background:"#fff8f0",border:`1px solid rgba(14,12,8,0.08)`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:9,color:C.green,letterSpacing:3,marginBottom:4}}>EVERYTHING DOCUMENTED.</div>
              <div style={{fontSize:9,color:accent,letterSpacing:3}}>NOTHING WASTED.</div>
            </div>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:48,color:"rgba(14,12,8,0.06)",letterSpacing:8}}>MX7</div>
          </div>
        </Rev>
      </section>

      {/* ─── FOOTER ─── */}
      <footer>
        <div className="footer-sig">
          <span style={{fontFamily:"'Bebas Neue'",fontSize:20,color:"rgba(242,237,228,0.4)",letterSpacing:5}}>MX</span>
          <span style={{fontFamily:"'Bebas Neue'",fontSize:20,color:accent}}>7</span>
        </div>
        <div style={{fontSize:9,color:"rgba(242,237,228,0.3)",letterSpacing:2}}>PITTSBURGH, PA — 2026</div>
        <div style={{fontSize:9,color:"rgba(242,237,228,0.3)",letterSpacing:2}}>EVERYTHING DOCUMENTED. NOTHING WASTED.</div>
      </footer>

      {/* TWEAKS */}
      <div className={`tweaks-panel${tweaksOpen?" open":""}`}>
        <div className="tw-title">TWEAKS</div>
        <div className="tw-row">
          <div className="tw-label">ACCENT COLOR</div>
          <div className="tw-opts">
            {[["gold","#c8a44a"],["purple","#7c4dba"],["red","#d94f38"]].map(([k,hex])=>(
              <button key={k} className={`tw-opt${tweaks.accentColor===k?" active":""}`} onClick={()=>setTweak("accentColor",k)}>
                <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:hex,marginRight:4,verticalAlign:"middle"}}/>
                {k.toUpperCase()}
              </button>
            ))}
          </div>
        </div>
        <div className="tw-row">
          <div className="tw-label">HERO STYLE</div>
          <div className="tw-opts">
            {["split","centered"].map(d=>(
              <button key={d} className={`tw-opt${tweaks.heroStyle===d?" active":""}`} onClick={()=>setTweak("heroStyle",d)}>{d.toUpperCase()}</button>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
